  modal(`<h3>\u{1F6D2} \u0E1A\u0E31\u0E19\u0E17\u0E36\u0E01\u0E01\u0E32\u0E23\u0E0B\u0E37\u0E49\u0E2D</h3><p class="bl">\u0E27\u0E31\u0E19\u0E17\u0E35\u0E48</p><div class="cash" id="bd">${[0, 1, 2].map((d) => {
    const t = new Date(Date.now() - d * 864e5).toLocaleDateString("sv-SE");
    return `<button data-d="${t}" class="${d ? "" : "on"}">${["\u0E27\u0E31\u0E19\u0E19\u0E35\u0E49", "\u0E40\u0E21\u0E37\u0E48\u0E2D\u0E27\u0E32\u0E19", "2 \u0E27\u0E31\u0E19\u0E01\u0E48\u0E2D\u0E19"][d]}</button>`;
  }).join("")}</div>
 <p class="bl">\u0E0B\u0E37\u0E49\u0E2D\u0E2D\u0E30\u0E44\u0E23</p><div class="cash bi3" id="bit">${BUY_ITEMS.map(([k, n]) => `<button data-i="${k}">${n}</button>`).join("")}</div>
 <p class="bl">\u0E0B\u0E37\u0E49\u0E2D\u0E17\u0E35\u0E48\u0E44\u0E2B\u0E19</p><div class="cash" id="bsh">${BUY_SHOPS.map((s) => `<button data-s="${s}">${s}</button>`).join("")}</div>
 <div class="calc"><label>\u0E08\u0E33\u0E19\u0E27\u0E19 <span id="bu">\u0E01\u0E01.</span><input id="bq" class="np" inputmode="none" placeholder="0"></label><label>\u0E08\u0E48\u0E32\u0E22\u0E44\u0E1B (\u0E1A\u0E32\u0E17)<input id="ba" class="np" inputmode="none" placeholder="0"></label></div>
 <div class="dot" id="bpu"></div>${pad()}<div class="btns"><button onclick="closeM()">\u0E22\u0E01\u0E40\u0E25\u0E34\u0E01</button><button class="p" id="bok" disabled>\u0E1A\u0E31\u0E19\u0E17\u0E36\u0E01</button></div>`);
  bindPad($("#mb"));
  const pick = (sel, attr, key) => $(sel).querySelectorAll(`[data-${attr}]`).forEach((b) => b.onclick = () => {
    f[key] = b.dataset[attr];
    $(sel).querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    if (key === "item") $("#bu").textContent = bunit(f.item);
    chk();
  });
  pick("#bd", "d", "date");
  pick("#bit", "i", "item");
  pick("#bsh", "s", "shop");
  const chk = () => {
    const q = +$("#bq").value, a = +$("#ba").value;
    const ok = f.item && f.shop && q > 0 && a > 0;
    $("#bok").disabled = !ok;
    if (q > 0 && a > 0 && f.item) {
      const pu = a / q, st = buyStats(buys)[f.item];
      let w = "";
      if (st && st.n >= 2) {
        const d = (pu - st.avg) / st.avg * 100;
        w = Math.abs(d) >= 5 ? ` \xB7 <b style="color:${d > 0 ? "var(--bad)" : "var(--acc)"}">${d > 0 ? "\u0E41\u0E1E\u0E07\u0E01\u0E27\u0E48\u0E32" : "\u0E16\u0E39\u0E01\u0E01\u0E27\u0E48\u0E32"}\u0E40\u0E09\u0E25\u0E35\u0E48\u0E22 ${Math.abs(d).toFixed(0)}%</b>` : " \xB7 \u0E43\u0E01\u0E25\u0E49\u0E40\u0E04\u0E35\u0E22\u0E07\u0E23\u0E32\u0E04\u0E32\u0E40\u0E09\u0E25\u0E35\u0E48\u0E22";
      }
      $("#bpu").innerHTML = `= \u0E3F${fmt(Math.round(pu * 100) / 100)} \u0E15\u0E48\u0E2D${bunit(f.item)}${w}`;
    } else $("#bpu").innerHTML = "";
  };
  $("#bq").addEventListener("input", chk);
  $("#ba").addEventListener("input", chk);
  $("#bok").onclick = () => {
    buys.push({ id: Date.now(), date: f.date, item: f.item, shop: f.shop, qty: +$("#bq").value, unit: bunit(f.item), amt: +$("#ba").value, dirty: 1 });
    store.set("buys", buys);
    closeM();
    rBuy();
    toast("\u0E1A\u0E31\u0E19\u0E17\u0E36\u0E01\u0E41\u0E25\u0E49\u0E27");
    setTimeout(sync, 300);
  };
}
function rBuy() {
  const mon = today().slice(0, 7);
  const ml = buys.filter((b) => b.date.startsWith(mon));
  const S = buyStats(buys);
  const mt = ml.reduce((s, b) => s + b.amt, 0), tt = buys.filter((b) => b.date === today()).reduce((s, b) => s + b.amt, 0);
  const sales = Core.summary(bills, today()).total;
  $("#p-buy").innerHTML = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><h2 style="margin:0">\u0E0B\u0E37\u0E49\u0E2D\u0E02\u0E2D\u0E07 / \u0E27\u0E31\u0E15\u0E16\u0E38\u0E14\u0E34\u0E1A</h2><button class="p bigb" id="badd">\uFF0B \u0E1A\u0E31\u0E19\u0E17\u0E36\u0E01\u0E01\u0E32\u0E23\u0E0B\u0E37\u0E49\u0E2D</button></div>
 <div class="kpis"><div class="kpi"><small>\u0E0B\u0E37\u0E49\u0E2D\u0E27\u0E31\u0E19\u0E19\u0E35\u0E49</small><div>\u0E3F${fmt(tt)}</div></div><div class="kpi"><small>\u0E22\u0E2D\u0E14\u0E02\u0E32\u0E22\u0E27\u0E31\u0E19\u0E19\u0E35\u0E49</small><div>\u0E3F${fmt(sales)}</div></div><div class="kpi"><small>\u0E0B\u0E37\u0E49\u0E2D\u0E40\u0E14\u0E37\u0E2D\u0E19\u0E19\u0E35\u0E49 (${ml.length} \u0E23\u0E32\u0E22\u0E01\u0E32\u0E23)</small><div>\u0E3F${fmt(mt)}</div></div></div>
 <h3>\u0E23\u0E32\u0E04\u0E32\u0E40\u0E09\u0E25\u0E35\u0E48\u0E22\u0E15\u0E48\u0E2D\u0E2B\u0E19\u0E48\u0E27\u0E22</h3>${Object.keys(S).length ? `<table><tr><th>\u0E27\u0E31\u0E15\u0E16\u0E38\u0E14\u0E34\u0E1A</th><th>\u0E40\u0E09\u0E25\u0E35\u0E48\u0E22</th><th>\u0E25\u0E48\u0E32\u0E2A\u0E38\u0E14</th><th>\u0E16\u0E39\u0E01\u0E2A\u0E38\u0E14\u2013\u0E41\u0E1E\u0E07\u0E2A\u0E38\u0E14</th><th>\u0E0B\u0E37\u0E49\u0E2D\u0E23\u0E27\u0E21</th></tr>${BUY_ITEMS.filter(([k]) => S[k]).map(([k, n, u]) => {
    const x = S[k], lp = x.last.amt / x.last.qty, d = (lp - x.avg) / x.avg * 100;
    return `<tr><td><b>${n}</b><br><small>${x.n} \u0E04\u0E23\u0E31\u0E49\u0E07</small></td><td><b>\u0E3F${fmt(Math.round(x.avg * 100) / 100)}</b>/${u}</td><td>\u0E3F${fmt(Math.round(lp * 100) / 100)}${Math.abs(d) >= 5 ? `<br><small style="color:${d > 0 ? "var(--bad)" : "var(--acc)"}">${d > 0 ? "\u25B2" : "\u25BC"} ${Math.abs(d).toFixed(0)}%</small>` : ""}<br><small>${x.last.shop}</small></td><td>\u0E3F${fmt(Math.round(x.min * 100) / 100)}\u2013${fmt(Math.round(x.max * 100) / 100)}</td><td>${fmt(Math.round(x.qty * 100) / 100)} ${u}<br><small>\u0E3F${fmt(x.amt)}</small></td></tr>`;
  }).join("")}</table>` : '<p class="empty" style="padding:20px">\u0E22\u0E31\u0E07\u0E44\u0E21\u0E48\u0E21\u0E35\u0E02\u0E49\u0E2D\u0E21\u0E39\u0E25 \xB7 \u0E01\u0E14 "\u0E1A\u0E31\u0E19\u0E17\u0E36\u0E01\u0E01\u0E32\u0E23\u0E0B\u0E37\u0E49\u0E2D"</p>'}
 <h3>\u0E1B\u0E23\u0E30\u0E27\u0E31\u0E15\u0E34\u0E01\u0E32\u0E23\u0E0B\u0E37\u0E49\u0E2D</h3>${buys.length ? `<table><tr><th>\u0E27\u0E31\u0E19\u0E17\u0E35\u0E48</th><th>\u0E23\u0E32\u0E22\u0E01\u0E32\u0E23</th><th>\u0E17\u0E35\u0E48</th><th>\u0E08\u0E33\u0E19\u0E27\u0E19</th><th>\u0E1A\u0E32\u0E17</th><th></th></tr>${buys.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0, 60).map((b) => `<tr><td>${b.date.slice(5).split("-").reverse().join("/")}</td><td>${bname(b.item)}</td><td>${b.shop}</td><td>${fmt(b.qty)} ${b.unit}</td><td><b>\u0E3F${fmt(b.amt)}</b></td><td><button class="sm" data-del="${b.id}">\u0E25\u0E1A</button></td></tr>`).join("")}</table>` : ""}`;
  $("#badd").onclick = buyForm;
  $("#p-buy").querySelectorAll("[data-del]").forEach((x) => x.onclick = () => {
    if (x.dataset.sure) {
      const b = buys.find((b2) => b2.id == x.dataset.del);
      b.deleted = 1;
      b.dirty = 1;
      buys = buys.filter((y) => y !== b);
      store.set("buys", buys);
      delQ.push(b);
      store.set("delQ", delQ);
      rBuy();
      setTimeout(sync, 300);
    } else {
      x.dataset.sure = 1;
      x.textContent = "\u0E22\u0E37\u0E19\u0E22\u0E31\u0E19\u0E25\u0E1A";
      x.style.color = "var(--bad)";
    }
  });
}

  $("#p-menu").querySelectorAll("input").forEach((x) => x.onchange = () => {
    menu[x.dataset.i].price = Math.max(0, +x.value);
    store.set("menu6", menu);
    rGrid();
  });
  $("#p-menu").querySelectorAll("[data-s]").forEach((x) => x.onclick = () => {
    const m = menu[x.dataset.s];

    $("#ok").onclick = () => {
      const n = $("#nn").value.trim(), p = +$("#np").value;
      if (!n || !(p >= 0)) return toast("\u0E01\u0E23\u0E2D\u0E01\u0E0A\u0E37\u0E48\u0E2D\u0E41\u0E25\u0E30\u0E23\u0E32\u0E04\u0E32");
      menu.push({ id: "m" + Date.now(), cat: $("#nc").value.trim() || "\u0E2D\u0E37\u0E48\u0E19\u0E46", e: "\u{1F37D}\uFE0F", name: n, price: p, opts: [] });
      store.set("menu6", menu);
      closeM();
      rMenu();
      rCats();
      rGrid();
    };
  };

    menu = JSON.parse(JSON.stringify(DEF_MENU));

    rCats();
    rGrid();
